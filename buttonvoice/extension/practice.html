<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ButtonVoice 离线体验页</title><link rel="stylesheet" href="./pages.css"></head>
<body><main class="practice"><header><div class="brand"><img src="./icons/48.png" width="38" height="38" alt=""><div><strong>ButtonVoice</strong><span>离线体验页</span></div></div><a href="./welcome.html">安装与使用说明</a></header>
<h1>先在这里，给按钮补上名称。</h1><p class="intro">这些页面故意包含没有名称的按钮。点击“打开检查面板”，选择问题、确认名称、应用后试听。你也可以在普通网页上通过扩展图标使用同样的流程。</p>
<div class="toolbar"><label for="scene">体验场景</label><select id="scene"><option value="uncertain">不确定控件 · 确认练习</option><option value="campus" selected>南科生活 · 校园服务</option><option value="shop">柚子商店 · 电商</option><option value="library">山海图书馆 · 阅读</option><option value="volunteer">微光行动 · 志愿者工具</option><option value="plain">普通网页 · 人工确认</option></select><button id="check" type="button">打开检查面板</button><button id="reset-page" type="button">重置体验页</button></div>
<div id="practice-root"></div></main><script type="module" src="./practice.js"></script></body></html>
